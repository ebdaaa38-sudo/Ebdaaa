<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Inner circle ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="#09131f" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Exchange Arrows & Arabic/English EbdAaa Monogram -->
  <g filter="url(#glow)">
    <!-- Top curved arrow -->
    <path d="M 180 190 A 90 90 0 0 1 330 190" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round"/>
    <polygon points="330,170 355,195 320,210" fill="#10b981"/>

    <!-- Bottom curved arrow -->
    <path d="M 332 322 A 90 90 0 0 1 182 322" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round"/>
    <polygon points="182,342 157,317 194,302" fill="#f59e0b"/>

    <!-- Central Diamond Core -->
    <polygon points="256,195 305,256 256,317 207,256" fill="url(#goldGrad)"/>
    <circle cx="256" cy="256" r="18" fill="#020617"/>
  </g>
</svg>
